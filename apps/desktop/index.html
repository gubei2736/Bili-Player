<!doctype html>
<html lang="zh-CN" class="dark select-none">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="/icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="referrer" content="no-referrer" />
		<title>Bili Player</title>
		<script>
			// 彻底禁止 WebView2 原生浏览器上下文菜单（返回、刷新、另存为、打印等）
			document.addEventListener(
				'contextmenu',
				function (e) {
					var t = e.target;
					if (
						t &&
						(t.tagName === 'INPUT' ||
							t.tagName === 'TEXTAREA' ||
							t.isContentEditable)
					) {
						return;
					}
					e.preventDefault();
				},
				true,
			);
		</script>
	</head>
	<body class="bg-[#0b0f17] text-foreground select-none overflow-hidden m-0 p-0 font-sans">
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
